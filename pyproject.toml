[project]
name = "shop"
version = "0.7.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "tzdata",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
